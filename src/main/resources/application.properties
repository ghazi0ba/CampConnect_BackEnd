spring.application.name=CampConnect_BackEnd

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/campConnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=root
spring.datasource.password=

# JWT (use a long base64 secret)
app.jwt.secret=YOUR_BASE64_SECRET_HERE
app.jwt.expiration=86400000



### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.servlet.context-path=/campconnect
