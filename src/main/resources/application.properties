spring.application.name=CampConnect_BackEnd

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/campConnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

### JWT ###
# Must be a Base64-encoded key (for jjwt with Decoders.BASE64.decode)
# Example generated base64 secret (replace with yours):
# app.jwt.secret=V2hhdGV2ZXJMb25nU2VjcmV0S2V5VGhhdElzQXRMZWFzdDMyQnl0ZXNMb25nISE=
app.jwt.secret=VGhpc0lzQVN1cGVyTG9uZ1NlY3JldEtleUZvckpXVEhTMjU2XzEyMzQ1Njc4OTA=
app.jwt.expiration=86400000

### SERVER ###
server.servlet.context-path=/campconnect

